name: Build Arvan Pejvak APK

on:
  push:
    branches:
      - arena/01a0fbb8-waterdog-anti
    paths:
      - 'arvan-pejvak/android/**'
      - 'arvan-pejvak/android-build/**'
      - '.github/workflows/build-arvan-pejvak-apk.yml'
  pull_request:
    paths:
      - 'arvan-pejvak/android/**'
      - 'arvan-pejvak/android-build/**'
      - '.github/workflows/build-arvan-pejvak-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace -p arvan-pejvak/android-build :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Add Gradle failure details to the run summary
        if: failure()
        run: |
          {
            echo '## Gradle build failure details'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/gradle-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Gradle error tail as check annotations
        if: failure()
        run: |
          diagnostics=$(grep -E 'FAILURE:|What went wrong|Execution failed|Could not|Caused by:|^e: |\.kt:[0-9]+:[0-9]+' "$RUNNER_TEMP/gradle-build.log" | tail -n 60 || true)
          if [[ -z "$diagnostics" ]]; then diagnostics=$(tail -n 20 "$RUNNER_TEMP/gradle-build.log"); fi
          printf '%s\n' "$diagnostics" | while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            echo "::error title=Gradle diagnostics::$escaped"
          done

      - name: Upload build log for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArvanPejvak-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Arvan Pejvak APK
        uses: actions/upload-artifact@v4
        with:
          name: ArvanPejvak-debug-apk
          path: arvan-pejvak/android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
