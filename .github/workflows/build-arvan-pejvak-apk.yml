name: Build Arvan Pejvak APK

on:
  push:
    branches:
      - arena/01a0fbb8-waterdog-anti
    paths:
      - 'arvan-pejvak/android/**'
      - 'arvan-pejvak/android-build/**'
      - '.github/workflows/build-arvan-pejvak-apk.yml'
  pull_request:
    paths:
      - 'arvan-pejvak/android/**'
      - 'arvan-pejvak/android-build/**'
      - '.github/workflows/build-arvan-pejvak-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p arvan-pejvak/android-build :app:assembleDebug

      - name: Upload Arvan Pejvak APK
        uses: actions/upload-artifact@v4
        with:
          name: ArvanPejvak-debug-apk
          path: arvan-pejvak/android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
