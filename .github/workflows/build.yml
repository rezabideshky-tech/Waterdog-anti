name: Build PocketMine-MP Plugin PHAR

on:
  push:
    branches: [ main, master, "arena/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, phar
          ini-values: phar.readonly=0

      - name: Lint PHP files
        run: |
          find src scripts -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build AntiAdvertising.phar
        run: |
          php -d phar.readonly=0 scripts/build_phar.php

      - name: Upload PHAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiAdvertising-PM5-phar
          path: AntiAdvertising.phar
