name: Build WaterdogPE plugins

on:
  push:
    branches:
      - main
      - master
      - arena/01a0fbb8-waterdog-anti
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'README_FA.md'
      - 'arvanshield/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            pom.xml
            arvanshield/pom.xml

      - name: Build WaterdogLobbyFallback
        run: mvn -B -U -f pom.xml clean package

      - name: Build and test ArvanShield
        run: mvn -B -U -f arvanshield/pom.xml clean verify

      - name: Upload WaterdogLobbyFallback JAR
        uses: actions/upload-artifact@v4
        with:
          name: WaterdogLobbyFallback-JAR
          path: target/waterdog-lobby-fallback-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload ArvanShield JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArvanShield-JAR
          path: arvanshield/target/arvanshield-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
