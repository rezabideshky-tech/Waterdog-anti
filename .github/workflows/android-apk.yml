name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'game/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'ساخت APK نسخهٔ انتشار (release) در کنار debug'
        type: boolean
        default: false

jobs:
  apk:
    name: ساخت APK بازی قارچ‌خور
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: کش کردن Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('game/package.json') }}

      - name: نصب وابستگی‌های Capacitor
        run: npm install --no-audit --no-fund

      - name: آزمون‌های بازی (بوت، پیمایش مرحله‌ها، رئیس‌ها)
        run: |
          cd tools && npm install --no-audit --no-fund && cd ..
          node tools/validate.mjs
          node tools/boss-test.mjs

      - name: افزودن پلتفرم اندروید
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node tools/patch-android.mjs
          npx cap sync android

      - name: ساخت APK آزمایشی
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ساخت APK نسخهٔ انتشار
        if: ${{ inputs.release == true }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: gharchekhor-apk
          path: |
            game/android/app/build/outputs/apk/debug/*.apk
            game/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: انتشار در Releases هنگام تگ
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: قارچ‌خور ${{ github.ref_name }}
          files: |
            game/android/app/build/outputs/apk/debug/*.apk
            game/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
