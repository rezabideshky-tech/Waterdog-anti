name: ArvanBedwarsIslands
main: arvan\islands\Main
version: 1.0.0
api: 5.1.3
load: STARTUP
depend: [Customies]
author: ArvanGaming
description: Four animated island NPCs for the Bedwars lobby
commands:
  bwislands:
    description: Place or remove Bedwars island NPCs
    usage: "/bwislands <spawn solo|spawn doubles|spawn triples|spawn squads|remove>"
    permission: arvanislands.admin
permissions:
  arvanislands.admin:
    default: op
    description: Manage island NPC placement
  arvanislands.use:
    default: true
    description: Use the configured Bedwars entry routes
