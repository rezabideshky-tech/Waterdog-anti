# آی‌پی که روی اسکوربرد/بوسبار نمایش داده می‌شه
ip: "Mc.CmGaming.IR"

# محافظت از بازیکنان تازه‌اسپاون‌شده در برابر ضربه/تخریب بلاک برای چند ثانیه اول
spawn-protection: true

# حداکثر تعداد بازی هم‌زمان که این سرور اجازه داره بسازه. وقتی به این سقف
# برسه و همه‌شون پر/شروع‌شده باشن، بازیکن جدید یا به یک سرور دیگه از همون
# نوع (مثلاً solo-2) منتقل می‌شه، یا در نبود اون به لابی برمی‌گرده.
max-concurrent-games: 3

# با true کردن این گزینه، مسیر پایان بازی (مراسم قهرمانی -> ریست بازی ->
# آنلود دنیا -> انتقال بازیکنان به لابی) با تایم‌استمپ دقیق و مدت زمان هر
# مرحله لاگ می‌شه. برای پیدا کردن علت کیک‌شدن بعد از مراسم قهرمانی، این رو
# موقتاً true کنید و لاگ سرور رو کنار debug-network (توی کانفیگ BedWarsCore)
# و کیک گزارش‌شده مقایسه کنید.
debug-match-end: false

# محافظ خودکار برای دنیاهایی که این پلاگین اصلاً لودشون نکرده ولی روی همین
# سرور لود موندن (مثلاً دنیاهای WaitingLobby-* که توی آنالیز Timings پیدا
# شدن - این اسم هیچ‌جای کد BedWarsGame/BedWarsCore وجود نداره، پس از یک
# worlds.yml/auto-load یا پلاگین دیگه میان). این پلاگین نه اونا رو آنلود
# می‌کنه و نه حذف - فقط دقیقاً مثل دنیاهای خودش، autosave روشون رو خاموش
# می‌کنه تا دیگه هیچ‌وقت باعث یک Chunk Save اجباری چند صدمیلی‌ثانیه‌ای روی
# ترد اصلی نشن (این خودش هیچ رفتاری برای بازیکنای داخل اون دنیا عوض نمی‌کنه).
# ریشه‌ی واقعی مشکل (چرا اصلاً لود شدن) باید توسط خود ادمین سرور توی
# worlds.yml / pocketmine.yml پیدا و برطرف بشه.
foreign-world-autosave-guard:
  enabled: true
  prefixes:
    - "WaitingLobby-"

# اگه true باشه (پیش‌فرض)، هم‌تیمی‌های تیم برنده که وسط بازی حذف شدن (فاینال‌کیل)
# ولی هنوز آنلاین و داخل همین بازی هستن هم روی سکوی قهرمانی قرار می‌گیرن و
# پاداش برد رو می‌گیرن. قبلاً فقط اعضای زنده‌ی تیم حساب می‌شدن، برای همین
# توی مود تریپل/اسکواد بعضی وقت‌ها فقط یک سکو ساخته می‌شد. با false کردن،
# رفتار قدیمی برمی‌گرده.
podium-include-eliminated-teammates: true
