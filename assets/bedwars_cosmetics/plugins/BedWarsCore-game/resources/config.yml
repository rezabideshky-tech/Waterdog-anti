# نام و نوع همین سرور — روی هر سرور باید متفاوت و مطابق جدول راهنمای ستاپ باشه
server-name: "lobby-1"
server-type: "lobby"

# سروری که بازیکن‌ها با آیتم "Leave Game" یا بعد از پایان بازی بهش منتقل می‌شن
# اگه لابی بالا پر/آفلاین بود، NetworkManager خودکار یک لابی دیگه با بیشترین ظرفیت خالی انتخاب می‌کنه
default-lobby: "lobby-1"

# اگه لاگ نمی‌بینید چرا یک سرور "آفلاین" نشون داده می‌شه، اینو true کنید
# (هر بار کوئری یک سرور fail بشه، دلیلش توی کنسول/لاگ چاپ می‌شه)
# همچنین با true بودن این گزینه، هر بار NetworkManager بخواد یک بازیکن رو
# منتقل کنه (مخصوصاً بعد از مراسم قهرمانی) جزئیات کامل انتخاب سرور مقصد
# و زمان دقیقش هم لاگ می‌شه - برای پیدا کردن علت کیک‌شدن بعد پایان بازی.
debug-network: false

# اگه اطلاعات کش‌شده‌ی یک سرور (از آخرین کوئری موفق/ناموفق) قدیمی‌تر از این
# مقدار (به ثانیه) باشه، NetworkManager دیگه بهش به عنوان مقصد انتقال اعتماد
# نمی‌کنه (حتی اگه آخرین وضعیت ثبت‌شده "online" بوده باشه) و رَدش می‌کنه؛
# جلوی انتقال بازیکن به یک سرور رو می‌گیره که وضعیتش دیگه تازه نیست.
# پیش‌فرض: ۳ برابر network-refresh-all-seconds
# network-stale-seconds: 15

# سیستم ریپورت / گزارش بازیکنان (Report System)
report:
  # حداقل فاصله (به ثانیه) بین دو ریپورت متوالی که یک بازیکن ثبت می‌کنه —
  # جلوگیری از اسپم کردن دکمه‌ی ریپورت
  cooldown-seconds: 30
  # در این بازه (به ثانیه)، اگه همون گزارش‌دهنده دوباره همون فرد رو ریپورت کنه
  # نادیده گرفته می‌شه (چون قبلاً برای همون فرد به staff اطلاع داده شده)
  duplicate-window-seconds: 600

database:
  type: mysql
  mysql:
    host: 127.0.0.1
    username: root
    password: ""
    schema: bedwars
    port: 3306
  worker-limit: 2

# لیست تمام سرورهای شبکه (باید روی همه‌ی ۵ سرور کاملاً یکسان باشه).
# NetworkManager هر ۵ ثانیه پورت بازی هر سرور رو async کوئری می‌کنه تا
# سرور سلکتور لابی وضعیت زنده (آنلاین/آفلاین + تعداد پلیر) رو نشون بده.
#
# ip         : آدرسی که به کلاینت واقعی داده می‌شه موقع ترنسفر (باید آی‌پی
#              عمومی/واقعی سرور باشه، وگرنه بازیکن نمی‌تونه وصل بشه)
# query-ip   : (اختیاری) آدرسی که فقط برای چک کردن وضعیت/تعداد پلیر استفاده
#              می‌شه. اگه همه‌ی سرورها روی یک ماشین هستن، این رو 127.0.0.1
#              بذارید - چون کوئری زدن یک سرور به آی‌پی عمومیِ خودِ همون ماشین
#              (hairpin NAT) اغلب fail می‌شه و باعث می‌شه سرور همیشه
#              "آفلاین" نشون داده بشه با اینکه واقعاً روشنه.
#              اگه ننویسید، پیش‌فرض همون "ip" استفاده می‌شه.
servers:
  lobby-1:
    ip: "5.57.32.63"
    query-ip: "127.0.0.1"
    port: 5698
    type: lobby
  solo-1:
    ip: "5.57.32.63"
    query-ip: "127.0.0.1"
    port: 5610
    type: solo
  double-1:
    ip: "5.57.32.63"
    query-ip: "127.0.0.1"
    port: 19134
    type: double
  triple-1:
    ip: "5.57.32.63"
    query-ip: "127.0.0.1"
    port: 19135
    type: triple
  squad-1:
    ip: "5.57.32.63"
    query-ip: "127.0.0.1"
    port: 19136
    type: squad

# ================================================================
# سیستم پاداش‌های تعاملی (Reward System) — سیستم زمان حضور + استریک ورود روزانه
# روی هر دو نوع سرور (لابی و بازی) لود می‌شه، چون داخل BedWarsCore هست.
# پیام‌های پاداش با سبک یکسان و بدون اسپم (صف‌بندی‌شده) نمایش داده می‌شن.
# ================================================================

playtime-rewards:
  # جدول پلکانی پاداش: هرچی زمان حضورِ فعال (نه AFK) بیشتر بشه، فاصله‌ی
  # بین پله‌ها و مقدار پاداش هم بزرگ‌تر می‌شه. minutes باید صعودی باشه.
  tiers:
    - { minutes: 5,   coins: 10,  xp: 15 }
    - { minutes: 15,  coins: 25,  xp: 25 }
    - { minutes: 30,  coins: 50,  xp: 35 }
    - { minutes: 60,  coins: 120, xp: 55 }
    - { minutes: 90,  coins: 150, xp: 70 }
    - { minutes: 120, coins: 200, xp: 90 }

  # بعد از این مقدار دقیقه‌ی حضورِ فعال در روز، دیگه هیچ پاداش زمانی
  # داده نمی‌شه (جلوگیری از تورم اقتصاد سرور). شمارنده هر روز ریست می‌شه.
  daily-cap-minutes: 120

  # اگه بازیکن این تعداد ثانیه حرکت/کلیک/چت نداشته باشه AFK در نظر گرفته
  # می‌شه و شمارنده‌ی زمان حضورش موقتاً متوقف می‌شه (ضد فارم با بات/AFK).
  afk-threshold-seconds: 60

daily-streak:
  # هر چند روز یک بار چرخه ریست می‌شه و بازیکن یک "Prestige" جدید می‌گیره
  # (استریک به ۱ برمی‌گرده ولی پاداش‌های چرخه‌ی بعدی ۱۰٪ به ازای هر
  # پرستیژ بزرگ‌تر می‌شن).
  cycle-length-days: 30

  # حداکثر تعداد "Streak Freeze" که بازیکن می‌تونه هم‌زمان ذخیره داشته
  # باشه. هر Freeze به‌صورت خودکار در صورت غیبت یک‌روزه مصرف می‌شه تا
  # استریک از بین نره.
  max-streak-freezes: 2

  # مراحل پاداش استریک. day باید یکتا باشه. grants-freeze یعنی رسیدن به
  # این روز یک Streak Freeze هم به بازیکن می‌ده. perk یک شناسه‌ی دلخواه
  # است که با DailyLoginStreakManager::hasPerk() قابل‌بررسی‌ست - مثلاً
  # "xp_boost" باعث +۱۰٪ XP روی پاداش‌های زمان حضور می‌شه.
  milestones:
    - { day: 7,  label: "Weekly Bonus",  coins: 150,  xp: 500,  grants-freeze: true }
    - { day: 11, label: "XP Boost",      coins: 50,   xp: 250,  perk: "xp_boost" }
    - { day: 14, label: "Weekly Bonus",  coins: 250,  xp: 800,  grants-freeze: true }
    - { day: 21, label: "Weekly Bonus",  coins: 350,  xp: 1100, grants-freeze: true }
    - { day: 30, label: "Monthly Bonus", coins: 1000, xp: 3000, grants-freeze: true }

clan:
  # هزینه‌ی ساخت اتحاد (بعد از تأیید اوپ از حساب بازیکن کم می‌شه، نه در
  # لحظه‌ی ارسال درخواست).
  creation-cost: 7000

  # درصدی از XP/کوینِ شخصیِ هر رویداد که هم‌زمان به XP کلن (کل + هفتگی)
  # هم اضافه می‌شه.
  xp-percent:
    kill: 10
    win: 15
    bed: 20

  # ضرایب فرمول امتیاز هفتگی لیدربورد کلن‌ها:
  # score = (wins * win-weight) + (finalKills * final-kill-weight) - (level * level-weight)
  weekly-score:
    win-weight: 10
    final-kill-weight: 3
    level-weight: 2

  # ظرفیت عضو بر اساس لول کلن (سطح => ظرفیت، صعودی).
  capacity:
    1: 10
    3: 15
    5: 20
    7: 30
    10: 50

  bank:
    # سقف روزانه‌ی واریز هر عضو به بانک کلن (ضد فارم/پول‌شویی داخلی).
    daily-deposit-limit: 5000

  # کول‌داون (ساعت) قبل از پیوستن به یک کلن *دیگر* بعد از Leave/Kick.
  # پیوستن مجدد به همون کلن قبلی محدودیت نداره.
  join-cooldown-hours: 24

  # روز هفته برای ریست خودکار امتیاز هفتگی (۰=یکشنبه ... ۶=شنبه).
  weekly-reset-day: 0

  name-min-length: 3
  name-max-length: 24
  tag-min-length: 2
  tag-max-length: 6
  description-max-length: 100
