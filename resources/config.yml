# ============================================================
#   AntiAdvertising - پلاگین ضد تبلیغات حرفه‌ای برای PocketMine-MP API 5
# ============================================================

# پیشوند پیام‌های پلاگین در چت
prefix: "§l§8[§cAnti§4Ad§8]§r "

# ------------------------------------------------------------
# بخش‌های مورد بررسی (Checks)
# ------------------------------------------------------------
checks:
  # بررسی پیام‌های چت عمومی
  chat: true
  # بررسی دستورات پیام خصوصی و عمومی (مثل /msg, /tell, /w)
  commands: true
  # بررسی متن تابلوها (Signs) هنگام قرار دادن یا ویرایش
  signs: true
  # بررسی متن و عنوان کتاب‌ها (Book & Quill)
  books: true
  # بررسی نام آیتم‌های تغییر نام داده شده (Anvil / Custom Name)
  item-rename: true

# لیست دستوراتی که آرگومان‌های آن‌ها باید برای تبلیغات بررسی شوند
monitored-commands:
  - "msg"
  - "tell"
  - "w"
  - "whisper"
  - "pm"
  - "dm"
  - "r"
  - "reply"
  - "me"
  - "say"
  - "broadcast"
  - "mail"
  - "emsg"
  - "etell"
  - "ewhisper"
  - "epm"

# ------------------------------------------------------------
# تنظیمات موتور تشخیص هوشمند (Detection Engine)
# ------------------------------------------------------------
detectors:
  # تشخیص آی‌پی‌های عددی (مثال: 192.168.1.1 یا 45.12.34.56:19132)
  ip-address: true
  # تشخیص دامنه‌ها و لینک‌های اینترنتی (مثال: play.example.ir, mc.server.com)
  domain-links: true
  # تشخیص لینک‌های دعوت دیسکورد (مثال: discord.gg/xxxx)
  discord-invites: true
  # تشخیص لینک‌های تلگرام، روبیکا و شبکه‌های اجتماعی (مثال: t.me/xxxx, rubika.ir/xxxx)
  social-links: true
  # تشخیص جملات و کلمات تبلیغاتی لیست سیاه
  blacklisted-phrases: true
  # تشخیص دور زدن فیلتر (اعداد فارسی، فاصله انداختن بین حروف، استفاده از (dot) یا [.]، کدهای رنگی و...)
  anti-obfuscation: true

# پسوندهای دامنه (TLD) که به عنوان لینک/آدرس سرور شناخته می‌شوند
monitored-tlds:
  - "ir"
  - "com"
  - "net"
  - "org"
  - "gg"
  - "xyz"
  - "me"
  - "io"
  - "co"
  - "tk"
  - "ml"
  - "ga"
  - "cf"
  - "gq"
  - "fun"
  - "top"
  - "club"
  - "site"
  - "online"
  - "store"
  - "shop"
  - "info"
  - "biz"
  - "us"
  - "eu"
  - "de"
  - "ru"
  - "uk"
  - "pro"
  - "host"
  - "aternos"
  - "falix"
  - "minehut"
  - "exaroton"

# ------------------------------------------------------------
# لیست سفید (Whitelist)
# آدرس سرور، سایت و دیسکورد خودتان را اینجا وارد کنید تا مسدود نشوند
# ------------------------------------------------------------
whitelist:
  - "play.myserver.ir"
  - "myserver.ir"
  - "discord.gg/myserver"
  - "t.me/myserver"
  - "127.0.0.1"

# ------------------------------------------------------------
# کلمات و عبارات تبلیغاتی ممنوعه (Blacklisted Phrases)
# ------------------------------------------------------------
blacklisted-phrases:
  - "بیاید سرورم"
  - "بیاین سرورم"
  - "بیاید سرور من"
  - "سرورم باز شد"
  - "سرور زدم بیاید"
  - "ای پی سرورم"
  - "آی پی سرورم"
  - "ادمین رایگان میدم"
  - "رنک رایگان میدم"
  - "join my server"
  - "come to my server"
  - "free op"
  - "aternos.me"
  - "falixnodes.net"
  - "falix.gg"
  - "exaroton.me"
  - "minehut.gg"
  - "pocketmine.mp"

# ------------------------------------------------------------
# سیستم اخطار و مجازات خودکار (Warnings & Punishments)
# ------------------------------------------------------------
warnings:
  # ذخیره اخطارها در فایل تا با ری‌استارت سرور پاک نشوند
  save-to-disk: true
  # زمان انقضای هر اخطار به ثانیه (86400 = 24 ساعت | 0 = دائمی)
  expire-seconds: 86400
  # پاک شدن اخطارهای بازیکن پس از اعمال آخرین مرحله مجازات (بن/کیک نهایی)
  reset-on-max-punishment: true

# مراحل مجازات بر اساس تعداد اخطارهای بازیکن
# انواع action قابل استفاده:
#   - "warn"    : فقط حذف تبلیغ و ارسال پیام اخطار به بازیکن
#   - "mute"    : سایلنت (Mute) موقت بازیکن به مدت duration ثانیه
#   - "kick"    : کیک کردن بازیکن از سرور
#   - "tempban" : بن موقت بازیکن از سرور به مدت duration ثانیه
#   - "ban"     : بن دائمی بازیکن از سرور
#   - "command" : اجرای دستور دلخواه در کنسول
punishments:
  1:
    action: "warn"
  2:
    action: "mute"
    duration: 300 # 5 دقیقه سایلنت
  3:
    action: "kick"
    reason: "§cتبلیغات در سرور ممنوع است! §7(اخطار 3)"
  4:
    action: "tempban"
    duration: 86400 # 24 ساعت بن
    ban-ip: false
    reason: "§cبن موقت به دلیل تکرار تبلیغات در سرور §7(24 ساعت)"
    # در صورت تمایل به اجرای دستور کنسول اضافی می‌توانید commands را فعال کنید:
    commands: []

# ------------------------------------------------------------
# تنظیمات گزارش‌دهی (Logging & Alerts)
# ------------------------------------------------------------
logging:
  # ارسال پیام هشدار لحظه‌ای به ادمین‌های آنلاین دارای پرمیشن antiadvertising.notify
  notify-staff: true
  # ثبت گزارش تبلیغات در کنسول سرور
  log-to-console: true
  # ذخیره تاریخچه تبلیغات در فایل detections.log در پوشه پلاگین
  log-to-file: true

# ------------------------------------------------------------
# پیام‌ها (Messages)
# متغیرهای قابل استفاده:
# {player}, {warns}, {max_warns}, {reason}, {source}, {content}, {duration}
# ------------------------------------------------------------
messages:
  ad-blocked-warning: "§cتبلیغات در این سرور اکیداً ممنوع است! §e(اخطار {warns}/{max_warns}) §7[دلیل: {reason}]"
  muted-notice: "§cشما به دلیل تلاش برای تبلیغات به مدت §e{duration} ثانیه §cسایلنت (Mute) شدید!"
  still-muted: "§cشما به دلیل تبلیغات سایلنت هستید! زمان باقی‌مانده: §e{remaining} ثانیه"
  kick-reason: "§c§lضد تبلیغات سرور\n§r§fشما به دلیل تکرار تبلیغات از سرور اخراج (Kick) شدید!\n§eتعداد اخطار: §c{warns}/{max_warns}\n§7دلیل: {reason}"
  ban-reason: "§c§lضد تبلیغات سرور\n§r§fحساب شما به دلیل تکرار تبلیغات مسدود (Ban) شد!\n§7دلیل: {reason}"
  staff-alert: "§cهشدار تبلیغ: §e{player} §7در بخش §b{source} §7تلاش کرد تبلیغ کند §8(اخطار {warns}/{max_warns})\n§8» §7تشخیص: §f{reason} §8| §7متن: §c{content}"
  sign-blocked-line: "§c[تبلیغ حذف شد]"
  no-permission: "§cشما دسترسی لازم برای استفاده از این دستور را ندارید."
  reload-success: "§aتنظیمات پلاگین ضد تبلیغات با موفقیت بازخوانی (Reload) شد."
