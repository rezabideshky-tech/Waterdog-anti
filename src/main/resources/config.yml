# WaterdogLobbyFallback configuration
# Names below must match entries in WaterdogPE's servers section.
# The first available name is tried first; add extra lobbies for failover.
lobby-servers:
  - lobby
  - lobby-2

# Reconnect reasons for which this plugin should choose a lobby.
# WaterdogPE reason names include: timeout, exception, unknown, server_kick,
# incompatible and transfer_failed.
fallback-reasons:
  - timeout
  - exception
  - unknown
  - server_kick
  - incompatible
  - transfer_failed

# If a player tries to transfer to an offline backend while still connected,
# send them to a lobby. If already on a configured lobby, keep them there.
fallback-on-transfer-failure: true
keep-current-lobby-on-transfer-failure: true

transfer-message: "§eسرور موقتاً از دسترس خارج شد؛ در حال انتقال به لابی..."
no-lobby-message: "§cهیچ لابی در دسترس نیست. لطفاً کمی بعد دوباره تلاش کن."
current-lobby-message: "§cسرور مقصد در دسترس نیست؛ در لابی می‌مانی."
